# compose.yml
#
services:
    app:
        build: .
        ports:
            - "8008:8822"
        volumes:
            - ./src:/app/src
            - ./public:/app/public
            - ./views:/app/views
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:8822/health"]
            interval: 10s
            timeout: 5s
            retries: 3

    web:
        image: nginx:alpine
        ports:
            - "8080:80"
        # volumes:
        #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 3

    db:
        image: mysql:lts
        environment:
            MYSQL_ROOT_PASSWORD:
            MYSQL_DATABASE:
        volumes:
            - mysql:/var/lib/mysql
        ports:
            - "3308:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 30s
            timeout: 10s
            retries: 5

volumes:
    mysql: